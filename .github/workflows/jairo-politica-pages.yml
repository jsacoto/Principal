name: Publicar Jairo Politica en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'jairo-politica/**'
      - '.github/workflows/jairo-politica-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jairo-politica-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio Jairo Politica
        run: |
          mkdir -p _site
          cp -R jairo-politica/. _site/
          touch _site/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
