<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jairo Sacoto — Investigación, docencia y divulgación tecnológica</title>
  <desc id="desc">Cabecera en tonos azul marino, azul eléctrico, celeste y blanco inspirada en la identidad visual de Tech Talk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#06183D"/>
      <stop offset="0.48" stop-color="#0B2E67"/>
      <stop offset="1" stop-color="#0C71B9"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0" stop-color="#2DA9E8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#2DA9E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#65C7F3" stroke-opacity=".16" stroke-width="1"/>
      <circle cx="0" cy="0" r="2.4" fill="#FFFFFF" fill-opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <g fill="none" stroke="#65C7F3" stroke-opacity=".32">
    <path d="M765 248L885 155L1017 211L1160 94" stroke-width="2"/>
    <path d="M810 62L930 130L1070 46L1188 118" stroke-width="1.5"/>
    <path d="M884 155L930 130L1017 211L1070 46" stroke-width="1"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="765" cy="248" r="4" fill-opacity=".78"/>
    <circle cx="885" cy="155" r="5"/>
    <circle cx="1017" cy="211" r="4" fill-opacity=".86"/>
    <circle cx="1160" cy="94" r="5"/>
    <circle cx="810" cy="62" r="3" fill-opacity=".8"/>
    <circle cx="930" cy="130" r="4"/>
    <circle cx="1070" cy="46" r="5"/>
    <circle cx="1188" cy="118" r="3"/>
  </g>

  <rect x="62" y="49" width="86" height="7" rx="3.5" fill="#2DA9E8"/>
  <text x="62" y="118" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="1.5">JAIRO SACOTO</text>
  <text x="64" y="160" fill="#8ED8F8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="2.8">INVESTIGACIÓN · DOCENCIA · DIVULGACIÓN</text>
  <text x="64" y="213" fill="#FFFFFF" fill-opacity=".92" font-family="Arial, Helvetica, sans-serif" font-size="20">
    Redes de Telecomunicaciones  |  Transformación Digital  |  Internet de las Cosas
  </text>
  <text x="64" y="251" fill="#BFEAFF" font-family="Arial, Helvetica, sans-serif" font-size="16">
    Universidad Politécnica Salesiana · Ecuador
  </text>
</svg>
